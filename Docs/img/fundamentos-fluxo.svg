    <text x="785" y="135" fill="#d1fae5" font-size="14">console ou DOM</text>
  </g>
  <g stroke="#64748b" stroke-width="4">
    <line x1="185" y1="115" x2="250" y2="115"/>
    <line x1="410" y1="115" x2="475" y2="115"/>
    <line x1="635" y1="115" x2="700" y2="115"/>
  </g>
